name: Workload intake
description: Introduce a new workload (a title alone is valid). Prefer the dashboard's Introduce action, which validates readiness and slug uniqueness first.
title: "[workload] "
labels: ["workload:proposed"]
body:
  - type: input
    id: slug
    attributes:
      label: Workload slug
      description: Kebab-case identity everything keys on (plan branches, frozen plan tags, chunks, runs). Must be unique.
      placeholder: demo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      description: What you want done and why, in a few sentences — the outcome, who it is for, and anything that must stay as it is. The planning agent reads this before proposing a plan, so be concrete about the result and leave the how to the plan. A title alone is fine while the workload is proposed; you can fill this in later. Prose only, no headings.
      placeholder: Send each customer their monthly invoice as a PDF attached to the email, instead of a link to the portal. Existing invoice numbering must not change.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional. Files or folders in this repository the planning agent must read before planning — one path per line, each inside runbooks/, useful-context/, inputs/, or specs/ (a folder means everything under it). Paths outside those folders or that don't exist are refused at intake. Leave empty to let the agent consult only the folders' README indexes.
      placeholder: |
        runbooks/domain-expert/billing.md
        useful-context/glossary.md
        inputs/demo2/
        specs/lza-01/spec.md
    validations:
      required: false
