# plan-gate — required status check on every approval PR (deterministic, no LLM:
# constitution Deterministic-First — plain Actions YAML, not gh-aw, by design).
# Branch protection marks this check required, so a red gate makes the operator's
# go-ahead (merge) physically impossible (FR-005/FR-012). Exit codes: 0 green ·
# 1 gate failure · 2 usage/IO · 3 API unavailable (fails closed and reruns).
# cost ceiling: $0 per run (constitution: Cost & Observability)
#
# TWO TRIGGERS, and the second exists because of a platform fact (found live,
# 2026-08-25). The `pull_request` job skips itself on a non-`plan/**` head, which
# produces a `skipped` check run and satisfies the required-check rule — that has
# worked since 2026-07-02 for pull requests a HUMAN opens. A DELIVERABLE pull request
# is opened by `build-publish` using GITHUB_TOKEN, and GitHub emits no workflow events
# for actions taken with that token, so this workflow never ran at all — not even to
# skip — and the head carried no `plan-gate` check run of any kind. PR #54's merge was
# refused with "Required status check plan-gate is expected" while deliverable-gate sat
# green beside it: permanently unmergeable.
#
# So the `workflow_run` job below records `plan-gate` = **skipped** on any open pull
# request with no plan document and no verdict yet. `skipped`, never `success`: that
# pull request was not gated, and a green plan-gate would claim it was.
#
# WHY NOT LET deliverable-gate WRITE THIS CONTEXT while it is already sweeping? Because
# a required check satisfiable by a DIFFERENT gate is not a required check any more,
# and a reader of a green `plan-gate` would have no way to know which code produced it.
# Each gate writes its own context.
name: plan-gate
# `workflow_run` is flagged by zizmor as a dangerous trigger. Accepted: the sweep job
# reads open pull requests and writes one check run saying this gate does not apply.
# It reads no artifact, judges no agent output, and merges nothing.
on: # zizmor: ignore[dangerous-triggers]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["build-publish"]
    types: [completed]
# PERMISSIONS ARE DECLARED PER JOB, NOT PER WORKFLOW (zizmor excessive-permissions,
# 2026-08-27). Both jobs below legitimately need the same three, so this is a scoping
# change rather than a reduction: the point is that a job added later starts from none
# instead of inheriting `checks: write` — the capability that writes the required check
# this whole workflow exists to report.
concurrency:
  # Keyed per pull request on the event path; one shared sweep otherwise, so two
  # build-publish completions cannot race to write the same check run.
  group: plan-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true
jobs:
  # Deliberately NOT named `plan-gate`: this job WRITES a check run of that name
  # rather than being one, and two things answering to one context is how a required
  # check comes to be satisfied by the wrong run.
  sweep-non-plan:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      issues: read # G7/G11 read the Andon break's corrections and answers to judge the plan
      checks: write # the plan-gate check run this workflow reports — its only write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: record plan-gate=skipped on pull requests that carry no plan document
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/gates/plan-gate.ts --sweep-non-plan --repo "$GITHUB_REPOSITORY"
  plan-gate:
    # Only approval PRs from plan/** branches carry a plan document to gate. Every
    # other PR reports "skipped", which satisfies the required-check rule — a plain
    # skip, never a fail, so ordinary development PRs are not blocked.
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'plan/')
    permissions:
      contents: read
      issues: read # G7/G11 read the Andon break's corrections and answers to judge the plan
      checks: write # the plan-gate check run this workflow reports — its only write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TWO CHECKOUTS, AND ONLY ONE OF THEM IS THE CANDIDATE'S (Codex on PR #145,
      # 2026-08-25 — flagged on deliverable-gate, and this file had it too).
      #
      # An unqualified `actions/checkout` on a `pull_request` event checks out the PR's
      # MERGE COMMIT, and the step below then executes `scripts/gates/plan-gate.ts` out
      # of it — so an approval pull request could carry a neutered G1–G16 and have its
      # own gate report the required check green. The agent path cannot reach this
      # (`plan-publish` writes only `plans/<slug>/plan.json`, so a plan branch's gate
      # code is whatever base had), but a hand-crafted `plan/**` branch can, and the
      # gate that guards the operator's go-ahead should not be readable as
      # "whatever the thing under review says it is".
      #
      # THE GATE CODE from the default branch. Same reasoning as GHI #107: freezing the
      # plan is FR-007, freezing the policy that judges it is not.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked).
          persist-credentials: false
      # THE PLAN DOCUMENT from the pull request, into a subdirectory it cannot escape.
      # This IS the thing under review and it has to come from the candidate — but it
      # is DATA, read and schema-validated by G1, never executed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - run: npm ci
      # Resolve the document the same way every other reader does (plans.ts
      # readPlanFileAtRef): canonical per-workload path first, pre-#79 repo root as
      # the fallback for branches published before it. The head ref reaches this
      # step as an env var and its slug is extracted with an anchored pattern — a
      # branch name is attacker-influenced text and must never be interpolated into
      # a shell command.
      - name: Locate the plan document
        id: plan
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" | sed -n 's#^plan/\([a-z0-9][a-z0-9-]*\)/v[0-9][0-9]*$#\1#p')"
          # Resolved inside the CANDIDATE checkout — the document under review lives
          # there, while the gate code that reads it comes from the default branch.
          path="candidate/plan.json"
          if [ -n "$slug" ] && [ -f "candidate/plans/$slug/plan.json" ]; then path="candidate/plans/$slug/plan.json"; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: plan-gate (G1, G2–G4, G7–G11)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_PATH: ${{ steps.plan.outputs.path }}
        run: npx tsx scripts/gates/plan-gate.ts --plan "$PLAN_PATH" --repo "$GITHUB_REPOSITORY" --json
