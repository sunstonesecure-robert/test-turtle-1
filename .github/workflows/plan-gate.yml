# plan-gate — required status check on every approval PR (deterministic, no LLM:
# constitution Deterministic-First — plain Actions YAML, not gh-aw, by design).
# Branch protection marks this check required, so a red gate makes the operator's
# go-ahead (merge) physically impossible (FR-005/FR-012). Exit codes: 0 green ·
# 1 gate failure · 2 usage/IO · 3 API unavailable (fails closed and reruns).
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: plan-gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: read # G7/G11 read the Andon break's corrections and answers to judge the plan
  checks: write # the plan-gate check run this workflow reports — its only write
concurrency:
  group: plan-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  plan-gate:
    # Only approval PRs from plan/** branches carry a plan document to gate. Every
    # other PR reports "skipped", which satisfies the required-check rule — a plain
    # skip, never a fail, so ordinary development PRs are not blocked.
    if: startsWith(github.event.pull_request.head.ref, 'plan/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked).
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      # Resolve the document the same way every other reader does (plans.ts
      # readPlanFileAtRef): canonical per-workload path first, pre-#79 repo root as
      # the fallback for branches published before it. The head ref reaches this
      # step as an env var and its slug is extracted with an anchored pattern — a
      # branch name is attacker-influenced text and must never be interpolated into
      # a shell command.
      - name: Locate the plan document
        id: plan
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$HEAD_REF" | sed -n 's#^plan/\([a-z0-9][a-z0-9-]*\)/v[0-9][0-9]*$#\1#p')"
          path="plan.json"
          if [ -n "$slug" ] && [ -f "plans/$slug/plan.json" ]; then path="plans/$slug/plan.json"; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: plan-gate (G1, G2–G4, G7–G11)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_PATH: ${{ steps.plan.outputs.path }}
        run: npx tsx scripts/gates/plan-gate.ts --plan "$PLAN_PATH" --repo "$GITHUB_REPOSITORY" --json
