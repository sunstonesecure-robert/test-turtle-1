# plan-post-merge — the single writer that freezes an approved plan (deterministic,
# no LLM — plain Actions YAML, not gh-aw, by design; it NEEDS direct contents/issues
# writes, which gh-aw strict mode rightly forbids for agentic jobs).
# On merge of an approval PR from plan/<slug>/v<N>: (1) annotated tag at the merge
# SHA — create-ref fails if it exists, first writer wins (FR-027, SC-008); tag
# message records approver + timestamp (FR-006, FR-026); (2) andon:resolved on the
# plan's Andon issue + close it (FR-006/FR-007; closed, not locked — the break stays
# a searchable record). The tag IS the official version (derived — 2026-07-11,
# GHI #44): nothing is pushed to main, so GITHUB_TOKEN needs no ruleset bypass on
# any repo type. That claim is about THIS workflow and was read for years as
# though it covered all of them: evidence-collect did push a file to the default
# branch, and was refused 409 on every run in every initialized repository until
# GHI #134 moved the record to the `evidence` branch. No machine credential has a
# bypass on the default branch, and none should — the fix moved the write, not
# the boundary.
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: plan-post-merge
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: write # frozen tag creation — this workflow is its ONLY writer (no branch pushes)
  issues: write # andon:resolved + close
concurrency:
  group: plan-post-merge-${{ github.event.pull_request.head.ref }}
jobs:
  freeze:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'plan/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked).
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: freeze approved plan (single writer)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PM_PR: ${{ github.event.pull_request.number }}
        run: npx tsx scripts/gates/post-merge-freeze.ts --pr "$PM_PR" --repo "$GITHUB_REPOSITORY"
