# deliverable-gate — required status check on every deliverable pull request
# (deterministic, no LLM: constitution Deterministic-First — plain Actions YAML, not
# gh-aw, by design). This is the gate that decides whether an agent's actual work may
# land, and the only gate in the system that reads a patch.
#
#   D1  provenance: a validated deliverable patch from a build run on the frozen tag,
#       whose head DESCENDS from that tag's commit (FR-060, FR-007 as amended)
#   D2  every path inside the delivering step's DECLARED scope (FR-061)
#   D3  merge authority resolved — pre-authorized, or the operator's own merge where
#       configuration demands a checkpoint or the step is high-stakes (FR-062)
#   D4  executor provenance recorded on the pull request (FR-065)
#   D5  no path inside the RESERVED set — the installed oversight machinery and the
#       governance record — read from the patch ALONE, never from the declared scope
#       (FR-068)
#
# REGISTRATION IS HALF THE GATE. A deliverable-gate that runs without being REGISTERED
# AS A REQUIRED CHECK reports its verdict and blocks nothing: D2 and D5 become
# advisory, silently, on a green-looking PR. `scripts/setup-repo.ts` registers the
# `deliverable-gate` context on the default-branch ruleset, and readiness item I7
# asserts that registration independently — because a missing workflow file is loud
# and an unregistered check is silent.
# cost ceiling: $0 per run (constitution: Cost & Observability)
#
# TWO TRIGGERS, AND THE SECOND IS THE ONE THAT ACTUALLY FIRES (found live, 2026-08-25).
# A deliverable pull request is opened by `build-publish` using GITHUB_TOKEN, and
# GitHub deliberately does not emit workflow events for actions taken with that token
# — so on the one pull request this gate exists for, `pull_request` NEVER ARRIVES.
# PR #54 sat with no checks at all and a required check that could never be satisfied:
# permanently unmergeable, and green-looking. The `workflow_run` job below SWEEPS every
# open deliverable pull request and writes the `deliverable-gate` check run itself. The
# `pull_request` trigger stays for a human-opened build/** branch, where it does fire.
name: deliverable-gate
# `workflow_run` is flagged by zizmor as a dangerous trigger. Accepted: this job reads
# a pull request and writes a check run reporting what the gate found. It performs no
# write derived from agent output and merges nothing.
on: # zizmor: ignore[dangerous-triggers]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["build-publish"]
    types: [completed]
  # RECOVERY, and it is not a test hook. A sweep that dies mid-loop leaves some pull
  # requests judged and some not, and nothing retries — the only recoveries were
  # re-running `build-publish` or pushing to the branch, neither of which is a thing an
  # operator looking at a stuck pull request would think to do. `build-verify` was given
  # this and these two were not, which was an inconsistency rather than a decision.
  #
  # No inputs, deliberately: the sweep decides its own subjects from repository state, so
  # there is nothing for an operator to point at the wrong thing.
  workflow_dispatch:
# PERMISSIONS ARE DECLARED PER JOB, NOT PER WORKFLOW (zizmor excessive-permissions,
# 2026-08-27). Both jobs below legitimately need the same three, so this is a scoping
# change rather than a reduction: the point is that a job added later starts from none
# instead of inheriting `checks: write` — the capability that writes the required check
# this whole workflow exists to report.
concurrency:
  group: deliverable-gate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true
jobs:
  # The sweep. Named `deliverable-gate` too? No — deliberately not: this job WRITES a
  # check run of that name rather than being one, and two things answering to one
  # context is how a required check comes to be satisfied by the wrong run.
  sweep:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read # read the frozen plan and compare commits for D1's descendancy check
      pull-requests: read # the PR body's deliverable:v1 marker and its changed file list
      checks: write # the deliverable-gate check run this workflow reports — its only write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: gate every open deliverable pull request (D1–D5) and record the verdict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_REQUIRES_OPERATOR_MERGE: ${{ vars.BUILD_REQUIRES_OPERATOR_MERGE }}
        run: npx tsx scripts/gates/deliverable-gate.ts --sweep --repo "$GITHUB_REPOSITORY"
  deliverable-gate:
    # Only build/** PRs carry a deliverable to gate. Every other PR reports "skipped",
    # which satisfies the required-check rule — a plain skip, never a fail, so approval
    # PRs and ordinary development PRs are not blocked. Same shape as plan-gate's own
    # `plan/**` condition, for the same reason.
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'build/')
    permissions:
      contents: read # read the frozen plan and compare commits for D1's descendancy check
      pull-requests: read # the PR body's deliverable:v1 marker and its changed file list
      checks: write # the deliverable-gate check run this workflow reports — its only write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # THE GATE CODE COMES FROM THE DEFAULT BRANCH, NOT FROM THE PULL REQUEST
      # (Codex on PR #145, 2026-08-25). An unqualified `actions/checkout` on a
      # `pull_request` event checks out the PR's MERGE COMMIT — candidate code — and
      # the step below then executes `scripts/gates/deliverable-gate.ts` out of it. A
      # `build/**` pull request could therefore ship a reserved-path change together
      # with a neutered D1–D5 and have its own gate report the required check green.
      # Worst on the operator-required path, where `build-merge` deliberately does
      # not merge and the human's decision is guided by exactly this check.
      #
      # This is GHI #107's lesson — run the gates from CURRENT code, not from the ref
      # under judgement — applied to the gate that judges deliverables. It costs
      # nothing here: `deliverableGate` reads the pull request, its files and the
      # frozen plan through the API and touches no worktree, so the candidate tree is
      # not needed at all.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: deliverable-gate (D1–D5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_REQUIRES_OPERATOR_MERGE: ${{ vars.BUILD_REQUIRES_OPERATOR_MERGE }}
        run: npx tsx scripts/gates/deliverable-gate.ts --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json
