# build-merge — the post-gate actor nobody had assigned (deterministic, no LLM).
#
# Two states were unreachable before this workflow existed (PR #115 Codex review):
#   1. On the repository default path — BUILD_REQUIRES_OPERATOR_MERGE unset, no
#      checkpoint path touched, the step not high-stakes — NOTHING MERGED the
#      deliverable pull request. build-publish opens it, deliverable-gate judges it,
#      the dashboard deliberately shows no button for a pre-authorized PR — so the
#      default path stalled one step before verification, forever.
#   2. Nothing ever replaced `build:awaiting-merge`, so a merged deliverable stayed
#      action-required in the portfolio permanently.
#
# TWO JOBS, TWO TRIGGERS:
#   merge      on deliverable-gate's completion — merges IF AND ONLY IF merge authority
#              resolves to `pre-authorized`. It NEVER merges an operator-required pull
#              request: that one waits for the human, and the label transition below
#              still applies when they merge it themselves. Operator-required is also
#              decided by WHAT THE DIFF TOUCHES (GHI #163 option 3, GHI #174): a subject
#              workflow `.github/workflows/<workload-slug>_<name>.yml` always waits, and so does
#              a path inside a CHECKPOINT_PATHS glob.
#   transition on the pull_request close event — flips build:awaiting-merge to
#              build:merged (or build:refused when closed unmerged), whoever merged it.
#
# IT RE-RUNS THE GATE RATHER THAN READING ITS CHECK RUN. A check run is a record of
# what the gate said at some past moment about some past commit; merging on it means
# merging on a claim. `build-merge.ts` re-runs deliverable-gate in-process, so this
# actor can never land something the gate would refuse — even with a stale green check
# sitting on the PR.
#
# IT NEEDS NO RULESET BYPASS, and must not be given one. setup-repo grants the main
# ruleset's only bypass to the repo-admin role; the github-actions Integration
# deliberately holds none (GHI #44). This actor merges a pull request whose required
# checks are green, which is the ordinary path the rules exist to permit. A bypass here
# would mean automation could land work the gates refused.
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: build-merge
# `workflow_run` is flagged by zizmor as a dangerous trigger — accepted for the reason
# above: this job performs no write derived from agent output. It re-runs the gate and
# merges only on the gate's own verdict about the code being merged.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["deliverable-gate"]
    types: [completed]
  pull_request:
    types: [closed]
    branches: [main]
  # RECOVERY, and it is not a test hook. A sweep that dies mid-loop leaves some pull
  # requests judged and some not, and nothing retries — the only recoveries were
  # re-running `build-publish` or pushing to the branch, neither of which is a thing an
  # operator looking at a stuck pull request would think to do. `build-verify` was given
  # this and these two were not, which was an inconsistency rather than a decision.
  #
  # No inputs, deliberately: the sweep decides its own subjects from repository state, so
  # there is nothing for an operator to point at the wrong thing.
  workflow_dispatch:
# PERMISSIONS ARE DECLARED PER JOB, NOT PER WORKFLOW (zizmor excessive-permissions,
# 2026-08-27). This workflow has TWO jobs whose authority genuinely differs, and a
# workflow-level grant hands each of them the union of both: `transition` only moves a
# label on an already-closed pull request, yet it would have carried `contents: write`
# and the ability to merge. Declared on the jobs, each holds what its own code calls
# and nothing more — and a third job added later starts from none rather than
# silently inheriting the merge capability.
concurrency:
  # One sweep at a time, so two gate completions cannot race to merge the same PR.
  group: build-merge-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'sweep' }}
jobs:
  merge:
    # SWEEPS rather than keying on the triggering payload's branch (found live,
    # 2026-08-25). The deliverable pull request is opened by GITHUB_TOKEN, so no
    # `pull_request` event exists to carry its branch, and a `workflow_run` triggered
    # by another `workflow_run` reports the DEFAULT branch as its head — not
    # `build/**`. Asking "which pre-authorized deliverables are green and unmerged?"
    # needs no event archaeology and is self-healing: a merge whose run was lost is
    # picked up on the next sweep.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write # pulls.merge writes the merge commit onto the base branch
      pull-requests: write # pulls.list finds the candidates, pulls.merge performs the merge
      issues: write # setBuildLabel moves build:* to merged once the merge lands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: merge every deliverable the approved plan pre-authorized
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_REQUIRES_OPERATOR_MERGE: ${{ vars.BUILD_REQUIRES_OPERATOR_MERGE }}
          # The operator's checkpoint paths (CONFIGURATION_GUIDE.md §3) — escalation-only,
          # like the line above: a touched path inside one of these globs is never merged
          # here. A subject workflow is never merged here regardless of this value.
          CHECKPOINT_PATHS: ${{ vars.CHECKPOINT_PATHS }}
        run: npx tsx scripts/build-merge.ts --repo "$GITHUB_REPOSITORY" --sweep
  transition:
    # The close event. Who merged it is not this job's business — only that it happened.
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'build/')
    # Strictly narrower than `merge` above, and derived from what transitionOnClose
    # actually calls: pulls.get, then addLabels/removeLabel. It writes no commit and
    # merges nothing, so it holds neither capability.
    permissions:
      contents: read # checkout only
      pull-requests: read # pulls.get, to learn whether the pull request merged or was closed
      issues: write # setBuildLabel moves build:* to merged or refused
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: transition the build:* label on close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BM_PR: ${{ github.event.pull_request.number }}
        run: npx tsx scripts/build-merge.ts --repo "$GITHUB_REPOSITORY" --pr "$BM_PR" --closed
