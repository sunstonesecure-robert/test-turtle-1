# workload-lifecycle — gated single writer for workload state (deterministic, no
# LLM — plain Actions YAML, not gh-aw, by design; it NEEDS direct issues/actions
# writes for label flips, run cancellation, close+lock).
# Step 1 runs lifecycle-gate — every gate-checks-cli.md §3 row is implemented now:
# L0/L1, US10's L2/L3 (complete: active, and every MUST-mapped verification
# target's latest vt-* check run on the frozen plan SHA concluded success),
# US12's L4–L8, and US13's L9 (archive: completed/canceled only). A red gate
# reports unmet items and performs nothing — and step 3 is what "reports" means
# on this path: it comments the unmet items on the workload issue, because a
# refused dispatch otherwise told its caller nothing (GHI #127). Step 2 applies
# the transition: flips the workload:* label, appends the workload-event:v1
# comment, close+locks on archive — and for cancel also cancels the workload's
# in-flight runs (REST cancel endpoint, SC-014) and closes its live Andon breaks
# as andon:superseded with open corrections withdrawn, causes recorded (FR-038);
# for a reactivate whose gate report says requires_review it re-opens the plan
# (FR-008 path) so the workload returns to review first (FR-040). There is no
# delete action anywhere — unknown actions exit 2 (FR-042), and `delete` is not
# offered in the dispatch choices.
# Two entry points, one writer: repository_dispatch (dashboard / API callers,
# actor from the payload) and workflow_dispatch (Actions-tab UI, actor is the
# clicking user — github.actor, never spoofable via inputs).
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: workload-lifecycle
on:
  repository_dispatch:
    types: [workload-lifecycle]
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload slug"
        required: true
      action:
        description: "Lifecycle transition"
        type: choice
        required: true
        options: [activate, complete, cancel, defer, reactivate, archive]
      reason:
        description: "Reason (recorded in the event comment; required by gate for cancel/defer)"
        required: false
      revisit:
        description: "Revisit date YYYY-MM-DD (defer only)"
        required: false
permissions:
  contents: read
  issues: write # workload:* labels + event comments — this workflow is their ONLY writer
  actions: write # cancel in-flight runs on workload cancel (SC-014)
  checks: read # L3 reads the frozen plan SHA's vt-* check runs (FR-034). Specifying
  #   ANY permissions block sets every unlisted scope to none, so without this row the
  #   complete transition fails with "Resource not accessible by integration" instead
  #   of returning an L3 verdict — read-only, and only the reporter ever writes them.
concurrency:
  group: workload-lifecycle-${{ github.event.client_payload.workload || inputs.workload }}
env:
  WL_WORKLOAD: ${{ github.event.client_payload.workload || inputs.workload }}
  WL_ACTION: ${{ github.event.client_payload.action || inputs.action }}
  # `by` FIRST, because that is the field the contract documents
  # (dashboard-github-api.md: client_payload {workload, action, by, reason?, revisit?})
  # and the `by:@login` convention every marker in this repo already uses. Reading
  # only `actor` meant a caller that followed the contract arrived with WL_ACTOR
  # empty, and BOTH consumers default an absent actor to `workload-lifecycle[bot]`
  # — so the operator's own transition was recorded as the bot's, in the
  # workload-event:v1 comment that IS the attributed audit record (FR-035), not
  # just in the refusal comment. `actor` is kept as a compatibility fallback for
  # ad-hoc callers that copied the reconcile dispatch's shape (PB-011).
  # Found by the PR #129 Codex review, which spotted it on the refusal path; the
  # apply path had the same defect and is fixed by the same line.
  WL_ACTOR: ${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.client_payload.by || github.event.client_payload.actor }}
  WL_REASON: ${{ github.event.client_payload.reason || inputs.reason }}
  WL_REVISIT: ${{ github.event.client_payload.revisit || inputs.revisit }}
jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: lifecycle-gate (refusal performs nothing)
        # Explicit bash => pipefail: a red gate must fail this step even though
        # tee (which preserves the report for the apply step AND the log) exits 0.
        shell: bash
        run: >-
          npx tsx scripts/gates/lifecycle-gate.ts
          --workload "$WL_WORKLOAD"
          --action "$WL_ACTION"
          --reason "$WL_REASON"
          --revisit "$WL_REVISIT"
          --repo ${{ github.repository }} --json
          | tee "$RUNNER_TEMP/lifecycle-gate.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: apply transition (cancel/reactivate effects + label flip + event comment; close+lock on archive)
        run: >-
          npx tsx scripts/lifecycle-apply.ts
          --workload "$WL_WORKLOAD"
          --action "$WL_ACTION"
          --actor "$WL_ACTOR"
          --reason "$WL_REASON"
          --revisit "$WL_REVISIT"
          --gate-report "$RUNNER_TEMP/lifecycle-gate.json"
          --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The refusal half (GHI #127). A red gate exits 1, pipefail fails the gate
      # step, and the apply step above — no `if:`, so `success()` — is skipped:
      # without this step a refused dispatch wrote NOTHING to the workload issue
      # and the caller got only a failed run. The report is already on disk (tee
      # wrote it before pipefail failed the step), so nothing re-runs.
      # `if: failure()` is broader than "the gate refused" — a crashed npm ci or
      # a green-gate/failed-apply run reaches it too — so the script posts ONLY
      # when the report parses AND carries blocking gates, and exits 0 either way
      # so this reporter never replaces the gate's failure with its own.
      - name: report the refusal on the workload issue (red gate only)
        if: failure()
        run: >-
          npx tsx scripts/lifecycle-refuse.ts
          --workload "$WL_WORKLOAD"
          --action "$WL_ACTION"
          --actor "$WL_ACTOR"
          --gate-report "$RUNNER_TEMP/lifecycle-gate.json"
          --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
