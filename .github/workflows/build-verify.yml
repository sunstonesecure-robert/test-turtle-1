# build-verify — verification executed against the MERGED deliverable commit
# (deterministic, no LLM where the plan made it so). This is what makes completion
# earnable against code that exists.
#
# Before US18 the build agent verified the FROZEN TREE, because nothing in the system
# could produce anything else — so `vt-*` check runs described a commit that never
# contained the work, and a completion could be earned on a lie (GHI #141).
#
# WHO STARTS THIS RUN, AND WHY (GHI #160, decision D5 of 2026-09-08):
#   workflow_dispatch  from `build-merge`, with `commit` = the merge commit it just made.
#                      This is the default pre-authorized path. It used to be a
#                      `workflow_run` on build-merge's completion, and THAT NEVER FIRED:
#                      build-template → build-publish → deliverable-gate → build-merge
#                      is already four `workflow_run` levels, GitHub stops the chain at
#                      three, and the bot's merge (made with GITHUB_TOKEN) emits no
#                      `push` either. Every "automated" verify in the PB-013 log was a
#                      hand dispatch. `workflow_dispatch` is exempt from both rules —
#                      the chain-depth limit and the GITHUB_TOKEN anti-recursion rule
#                      — which is why build-merge can start this run and nothing else
#                      could. That exemption is documented by GitHub and observed here
#                      for the first time by experiment E1 (docs/shared-understanding/
#                      EXPERIMENTS.md); if a merge ever lands with no run behind it,
#                      the fallback below is the recovery and E1 is where to write down
#                      what was seen.
#   push               a HUMAN merged the deliverable — the operator-checkpoint path.
#                      The pushed commit is the subject.
#   workflow_dispatch  by a person, with no inputs: THE FALLBACK. The subject resolver
#                      sweeps for the newest merged deliverable whose merge commit is
#                      not yet verified — a question asked of repository state, so it
#                      recovers a lost run without the operator naming a commit. A
#                      person may also name `commit` (and `plan_ref`) to re-verify one
#                      merge; B9 refuses a commit the approved plan never led to, and
#                      the subject step REFUSES (exit 1) a named commit that is not a
#                      merged deliverable's merge commit — a named commit is a
#                      verification request, and an empty run that exits green would
#                      answer it with nothing while looking like an answer (PR #204 F8).
#                      Only the no-input sweep and the `push` path may find nothing and
#                      exit clean: an ordinary push is not a verification event.
# There is deliberately NO scheduled sweep (option 1 on GHI #160 was offered and
# declined): a merge is verified within seconds or the operator sees a gap on the
# card, not a result that arrives on a timer.
#
# WHO RECORDS THE RESULTS, AND WHY IT IS A JOB OF THIS RUN (GHI #228, 2026-09-11):
#   The `report` job at the bottom of this file. It used to be a SEPARATE workflow
#   (`vt-report.yml`, triggered `workflow_run` on this one's completion) and on the
#   pre-authorized path THAT NEVER FIRED — which is the second half of the same
#   platform rule the trigger note above is about. GitHub: "events triggered by the
#   GITHUB_TOKEN will not create a new workflow run", with `workflow_dispatch` and
#   `repository_dispatch` as the only exceptions. build-merge's DISPATCH is exempt,
#   so this run starts; the COMPLETION of a run the token dispatched is not, so no
#   `workflow_run` was ever emitted for the reporter. Isolated live on 2026-09-11:
#   two build-verify runs, same workflow pair, same `workflow_dispatch` event, same
#   `success` conclusion, differing only in actor — 32872584724 (a person) was
#   followed by a vt-report run 22 s later, 34637800206 (github-actions[bot]) by no
#   run of any conclusion. Chaining one more `workflow_run` is not available either:
#   GitHub stops the chain at three levels.
#
#   So the report needs no EVENT: this run already exists, and a job of a run that
#   exists is scheduled by `needs:`, not by a trigger. `scripts/vt-report.ts` is
#   unchanged — same artifact-as-untrusted-input validation, same refusals, same
#   create-never-update semantics.
#
#   THE TRUST BOUNDARY IS TIGHTER THAN IT WAS, not looser. The substrate split's
#   purpose is that whatever EXECUTES THE DELIVERABLE'S COMMANDS holds no write. That
#   is `verify`, and it keeps the read-only grant below. `checks: write` lives on
#   `report` alone — a job that checks out only the product toolchain, runs no
#   subject command, and reads the artifact as data. The retired workflow held that
#   scope at WORKFLOW level.
#
#   ONE CONSEQUENCE, NAMED. This run's conclusion changes meaning. A report refusal
#   (a commit that does not descend from the frozen tag, a superseded plan_ref, an
#   unknown target id, a missing artifact) used to show as a red `vt-report` run
#   beside a green `build-verify`; it now makes THIS run red, while
#   `scripts/build-verify.ts` still deliberately exits 0 for a FAILING TARGET. So a
#   green run means "verification could be performed AND its results were recorded",
#   which is the honest reading. Recovery is unaffected: the no-input sweep keys on
#   unmet MUST targets, never on a run's conclusion, so a merge whose report failed
#   is picked up by the next sweep.
#
# HOW A TARGET IS EXECUTED. `VerificationTarget.run` (the executable form the operator
# approved alongside the prose `check`) is one shell command whose exit status is the
# verdict. A MUST-mapped target with no `run` is NOT REPORTED — it cannot be verified
# deterministically, and L3 fails closed on a target with no check run, so completion
# stays refused until the plan is re-opened to add one or a conformant executor
# interprets the prose in verify mode. What this must never do is report a result for a
# target it did not check.
#
# A TARGET THAT CHANGES THE CHECKOUT IS NOT A RESULT (GHI #162). The runner snapshots
# the tree before and after every target; a target that wrote, deleted or committed
# anything is recorded `action_required` naming what it touched, and the checkout is
# reset before the next target runs — so no target can make a later one pass against
# a tree the merge commit does not contain.
#
# A TARGET THAT PASSES WITHOUT ITS STEP WITNESSED NOTHING (GHI #230, the NEGATIVE
# CONTROL). Every target that concludes `success` is re-executed against the FROZEN PLAN
# TREE — the commit `plan/<slug>/v<N>` tags, checked out at `base/`. A target that passes
# THERE TOO asserts something that was already true before any of the plan's work
# existed, so its green says nothing about the step it maps to; it is recorded
# `action_required` naming the reason, and L3 fails closed on it. Found live 2026-09-11:
# of 19 targets, three reported success against a tree that had received none of the
# plan's 8 steps — one because a `;`-list reports only its LAST command's status, one
# because `!` inverts grep's exit 2 (an ERROR, not "no match") into a pass. No single
# lint of the command text catches both; asking the target to discriminate does, and it
# reads no command text at all.
#
# WHY THE FROZEN TAG AND NOT THE MERGE COMMIT'S FIRST PARENT (Codex P1 on PR #233, and
# this is the one that would have broken the north star). The first parent is the default
# branch as it was immediately before THIS deliverable landed — which, on the second and
# every later delivery of a multi-step plan, ALREADY CONTAINS the earlier steps. Since
# this workflow runs EVERY target of the plan against every merged deliverable, and
# lifecycle-gate L3 reads only the NEWEST merge commit, every earlier step's target would
# pass on both trees, be demoted to `action_required`, and refuse completion forever: an
# 8-MUST-step plan could never be completed incrementally, which is exactly the path the
# deliverable seam exists for. The frozen tag has no such drift — `build-publish` cuts
# every deliverable branch FROM that commit, so it contains none of the plan's work no
# matter how many deliverables have landed. It is also what B9 already proved the subject
# descends from, so the two trees are on one line of history by construction.
#
# THE RESIDUAL, NAMED. A plan RE-OPENED and re-frozen after some of its steps had already
# landed carries that work in the new tag's tree, so those steps' targets would pass on
# the base and be demoted. Real, narrower, and out of scope here — GHI #234.
#
# THE COMMANDS RUN WITHOUT CREDENTIALS: GITHUB_TOKEN and the agent keys are stripped
# from the child environment before any target executes. Operator-approved is not the
# same as trusted with the repository's write scope.
#
# IT ALWAYS UPLOADS AN ARTIFACT, even with nothing to verify — `subject.txt` says which
# commit was judged, or is empty. That is what lets the reporter tell "this push was not
# a deliverable merge" (fine) from "the artifact is missing" (loud), instead of
# treating both as nothing to do. The upload survived the reporter becoming a job of
# this run: jobs do not share a filesystem, so the artifact is still the channel — it
# is simply read within the run that wrote it instead of across two runs.
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: build-verify
on:
  push:
    branches: [main]
  # THE ENTRY POINT build-merge uses, and the manual fallback — one trigger, two callers.
  #
  # Both inputs are optional strings, the same convention the completion → dispatch
  # hook asks of a subject workflow (CONFIGURATION_GUIDE.md §7), so a person pressing
  # "Run workflow" with the form empty gets the sweep. `commit` names the merge commit
  # to verify; the frozen plan it delivers is READ FROM THE DELIVERABLE PULL REQUEST'S
  # MARKER, written by build-publish — never taken from a caller. `plan_ref`, when
  # given, is checked against that answer and a disagreement stops the run: an input
  # is a claim, the marker is the record.
  workflow_dispatch:
    inputs:
      commit:
        description: "Merge commit to verify (40-hex sha). Empty = sweep for the newest unverified merged deliverable."
        type: string
        required: false
      plan_ref:
        description: "Frozen plan ref the commit is expected to deliver (plan/<slug>/v<N>). Optional cross-check only."
        type: string
        required: false
# GOVERNS `verify`, WHICH DECLARES NO BLOCK OF ITS OWN — and that omission is load-
# bearing. A job-level `permissions:` block REPLACES this one and sets every unlisted
# scope to `none`, so giving `verify` a tidy-looking `contents: read` would silently
# revoke the three reads below and break the run (it broke live once already, on
# `issues`). `report` overrides deliberately, and lists what it needs.
permissions:
  contents: read # read the frozen plan; the merged tree comes from the checkout
  pull-requests: read # find the deliverable pull request behind the commit
  checks: read # "has this merge been verified yet?" — asked of the check runs themselves
  issues: read # preflight B7 reads the workload's lifecycle label off its ISSUE — omitted
  #   at first, and the whole verify run failed with "workload not found: demo7"
  #   (found live, 2026-08-25). A missing read scope reads exactly like a missing
  #   workload, which is why the gate's own message could not point at the cause.
concurrency:
  # Keyed on the COMMIT UNDER VERIFICATION, not the run's own sha: two merges in one
  # build-merge sweep dispatch two runs seconds apart, both with `github.sha` at the
  # same default-branch head, and one concurrency group for both would cancel the
  # pending one — a merge silently left unverified.
  group: build-verify-${{ github.event_name }}-${{ inputs.commit || github.sha }}
jobs:
  verify:
    runs-on: ubuntu-latest
    # 40, NOT 20 (Codex P1 on PR #233, 2026-09-12). The negative control re-executes
    # every GREEN target a second time, so the worst case for a passing plan doubled
    # while this budget did not. Each target may take 5 minutes; three slow greens went
    # from ~12 minutes to ~24 and would be CANCELLED mid-run — before the artifact
    # upload, so the `report` job records nothing at all and the merge reads unverified.
    # The number tracks the work: the pass doubled, so the budget does. It was never a
    # bound on target COUNT (19 targets × 5 minutes exceeds any of these), and a plan
    # that needs more than this is a plan whose targets are too slow to verify on a
    # merge — which the run says out loud rather than discovering at the cap.
    timeout-minutes: 40
    # NO `permissions:` BLOCK HERE — see the note above the workflow-level one.
    #
    # WHAT `report` BINDS TO. Both come from the deterministic subject step, which
    # runs BEFORE the merged tree is checked out and before any verification target's
    # command executes; a later step cannot alter an earlier step's outputs. So
    # `subject_sha` is the commit this run judged, not `github.sha` — which on a
    # `workflow_dispatch` is the default branch's head at dispatch time, and would
    # name the LATER commit when two merges land seconds apart.
    outputs:
      subject_sha: ${{ steps.subject.outputs.sha }}
      plan_ref: ${{ steps.subject.outputs.plan_ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: which commit is this run about, and of which frozen plan?
        id: subject
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BV_SHA: ${{ github.sha }}
          BV_EVENT: ${{ github.event_name }}
          BV_INPUT_COMMIT: ${{ inputs.commit }}
          BV_INPUT_PLAN_REF: ${{ inputs.plan_ref }}
        run: |
          set -euo pipefail
          if [ "$BV_EVENT" = "push" ]; then
            out="$(npx tsx scripts/build-verify-subject.ts --repo "$GITHUB_REPOSITORY" --commit "$BV_SHA")"
          elif [ -n "$BV_INPUT_COMMIT" ]; then
            if ! printf '%s' "$BV_INPUT_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "refusing: commit input '$BV_INPUT_COMMIT' is not a 40-hex sha — pass the merge commit's full sha, or leave it empty to sweep" >&2
              exit 1
            fi
            out="$(npx tsx scripts/build-verify-subject.ts --repo "$GITHUB_REPOSITORY" --commit "$BV_INPUT_COMMIT")"
          else
            out="$(npx tsx scripts/build-verify-subject.ts --repo "$GITHUB_REPOSITORY" --sweep)"
          fi
          sha="$(printf '%s' "$out" | sed -n 1p)"
          plan_ref="$(printf '%s' "$out" | sed -n 2p)"
          # An EXPLICIT commit that resolves to no deliverable is a refusal, not an empty
          # run (PR #204 F8). The resolver prints two empty lines for "nothing", which is
          # right for the sweep and for a push — neither asked about a particular commit.
          # But a person or build-merge that NAMED a commit asked "verify this", and a
          # green run that verified nothing is the absent-≠-success shape in the one
          # pipeline that must never have it. Checked before the plan_ref cross-check,
          # which cannot fire on an empty plan_ref and would otherwise let this through.
          if [ -n "$BV_INPUT_COMMIT" ] && [ -z "$plan_ref" ]; then
            echo "refusing: commit $BV_INPUT_COMMIT is not a merged deliverable's merge commit — no merged build/* pull request with a deliverable:v1 marker has it as its merge commit, so there is nothing to verify. Pass the merge commit of a MERGED deliverable pull request (its sha on the default branch), or leave commit empty to sweep for the newest unverified merge" >&2
            exit 1
          fi
          if [ -n "$BV_INPUT_PLAN_REF" ] && [ -n "$plan_ref" ] && [ "$BV_INPUT_PLAN_REF" != "$plan_ref" ]; then
            echo "refusing: plan_ref input '$BV_INPUT_PLAN_REF' disagrees with the deliverable pull request's marker ('$plan_ref') for $sha — the marker is the record; re-run without plan_ref, or with the marker's value" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "plan_ref=$plan_ref" >> "$GITHUB_OUTPUT"
      - name: prepare the results directory (always, so the report job can tell absent from empty)
        env:
          BV_PLAN_REF: ${{ steps.subject.outputs.plan_ref }}
          BV_SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          printf '%s\n' "$BV_PLAN_REF" > "$RUNNER_TEMP/verify/subject.txt"
          printf '%s\n' "$BV_SUBJECT_SHA" > "$RUNNER_TEMP/verify/verified-commit.txt"
      # THE MERGED COMMIT, checked out over the default-branch checkout above. The
      # tree the targets are executed against must be the tree the results describe —
      # verifying `main` and reporting on the merge commit is the same class of lie
      # GHI #141 was about.
      - name: check out the commit under verification
        if: steps.subject.outputs.plan_ref != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.subject.outputs.sha }}
          path: subject
          persist-credentials: false
      # PREFLIGHT B9 — the verified commit must DESCEND from the frozen plan tag
      # (FR-063). B8 asks the same family of question of a BUILD's dispatch ref; this
      # asks it of a VERIFICATION's subject, and neither substitutes for the other.
      - name: build-preflight (B9 — the verified commit descends from the frozen tag)
        if: steps.subject.outputs.plan_ref != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BV_PLAN_REF: ${{ steps.subject.outputs.plan_ref }}
          BV_SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: >-
          npx tsx scripts/gates/build-preflight.ts
          --plan-ref "$BV_PLAN_REF"
          --verify-commit "$BV_SUBJECT_SHA"
          --repo "$GITHUB_REPOSITORY" --json
      # THE FROZEN PLAN TREE — the negative control's base (GHI #230; see the header for
      # why it is this commit and not the merge commit's first parent). A verification
      # target is supposed to WITNESS the step it maps to, so it is asked to: a target
      # that passes here, on a tree holding none of the plan's work, passed without the
      # work present, and its green is not evidence about the step.
      #
      # `plan_ref` comes from the deliverable pull request's own marker, never from a
      # caller, so this checkout can only be the approved plan's own baseline.
      #
      # AFTER B9, DELIBERATELY. Both steps depend on the frozen tag resolving, and B9 is
      # the one that can SAY SO: a tag that has gone missing gets its refusal — naming
      # the plan ref, the commit and the rule — instead of a raw `couldn't find remote
      # ref` from the checkout action, which reads like an infrastructure fault. The
      # ordering costs nothing (no target has run yet either way) and buys the better
      # message on the one failure both share.
      - name: check out the frozen plan tree (the negative control's base)
        if: steps.subject.outputs.plan_ref != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ steps.subject.outputs.plan_ref }}
          path: base
          persist-credentials: false
      - name: execute every verification target with an executable form
        if: steps.subject.outputs.plan_ref != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BV_PLAN_REF: ${{ steps.subject.outputs.plan_ref }}
        run: >-
          npx tsx scripts/build-verify.ts
          --plan-ref "$BV_PLAN_REF"
          --repo "$GITHUB_REPOSITORY"
          --cwd "$GITHUB_WORKSPACE/subject"
          --base-cwd "$GITHUB_WORKSPACE/base"
          --out "$RUNNER_TEMP/verify/vt-results.json"
      - name: upload the verification results for the report job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vt-results
          path: ${{ runner.temp }}/verify/
          if-no-files-found: error

  # THE REPORTER (GHI #228) — the `vt-*` check runs, written on the commit the verify
  # job actually judged. This job is their ONLY writer; it moved here verbatim from the
  # retired `vt-report.yml`, whose `workflow_run` trigger never fired on the
  # pre-authorized path (see WHO RECORDS THE RESULTS at the top of this file).
  report:
    needs: verify
    # BOTH HALVES MATTER, and only one of them is visible unless written out.
    #
    # `success()` is what the retired workflow's `workflow_run.conclusion == 'success'`
    # became. GitHub applies it implicitly to any job `if` with no status-check
    # function — but `scripts/build-verify.ts` exits 0 ON A FAILING TARGET on purpose
    # (a failing target is a real result that must be recorded), so the next reader who
    # wants "report the failures too" will reach for `always()` or `!cancelled()` and
    # delete the conclusion gate without noticing it was ever here. It is here: a
    # verify job that could not perform the verification has nothing to report.
    #
    # The `plan_ref` half is new. An ordinary push with nothing to verify now SKIPS
    # this job instead of producing a green no-op run.
    if: success() && needs.verify.outputs.plan_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REPLACES the workflow-level block for this job only — every unlisted scope is
    # `none`, which is the point: this job holds the one write in the file.
    permissions:
      checks: write # the vt-<id> check runs — this job is their ONLY writer (FR-042, FR-034)
      contents: read # dereference the frozen plan tag, read plan.json at it, compare commits for descendancy
      actions: read # the artifact download below. A SAME-RUN download is served by the
      #   Actions runtime token and documents no permission requirement, unlike every
      #   other download-artifact in this repo (all cross-run, all passing run-id +
      #   github-token). The scope is kept anyway: it is a READ, so it costs the
      #   substrate split — which is about writes — nothing, and the alternative was
      #   letting the first live proof of GHI #228 fail for a reason unrelated to the
      #   fix. Removable once a live run shows the download works without it.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked). This checks
          # out the PRODUCT TOOLCHAIN only — never the subject commit, and no
          # operator-approved command runs in this job.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: download this run's verification results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # SAME RUN — no `run-id`, no `github-token`. Named explicitly so a future
          # second artifact in this workflow cannot silently join the download.
          name: vt-results
          path: ${{ runner.temp }}/vt-artifacts
      - name: report vt-<id> check runs on the verified (merged deliverable) commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The verify job's own answer to "which commit is this run about". Note
          # `--expect-sha` is the FALLBACK, not the binding: vt-report.ts prefers the
          # artifact's `verified-commit.txt` whenever it is non-empty, and the verify
          # job writes that file from this same step output. Both channels therefore
          # carry the same string; the flag is kept because it makes the binding
          # visible here and leaves the CLI contract unchanged.
          VT_SHA: ${{ needs.verify.outputs.subject_sha }}
        run: >-
          npx tsx scripts/vt-report.ts
          --dir "$RUNNER_TEMP/vt-artifacts"
          --expect-sha "$VT_SHA"
          --repo "$GITHUB_REPOSITORY"
