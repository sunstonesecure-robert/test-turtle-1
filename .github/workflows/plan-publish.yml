# plan-publish — deterministic writer for agent-proposed plans (plain Actions
# YAML, no LLM — by design: the plan-propose agentic job is read-only and its
# safe outputs cannot push branches). On plan-propose completion: downloads the
# uploaded plan.json artifact, validates it with the PlanDoc parser in schemas/plan.ts
# (the zod mirror of schemas/plan.schema.json — the mirror is what every validator in
# the product actually runs; the two copies have diverged on `feature` and that is
# reported, not fixed, in T279),
# locates the run's Andon break (andon:v1 header, else the gh-aw footer link to
# this triggering run — the safe-output sanitizer strips agent HTML comments, so
# the publisher injects the canonical header), patches the real andon_issue
# number in, and creates plan/<slug>/v<N> with the document committed at
# plans/<slug>/plan.json — one directory per workload, so one workload's approval
# merge never touches a file another workload's plan branch owns (GHI #79).
# RESUMABLE on re-delivery or partial publish (existing branch/file completed,
# unchanged content = no-op); an existing frozen TAG for the version is a hard
# error (agent must bump). Substrate split: agent proposes, deterministic
# single writer publishes/normalizes.
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: plan-publish
# zizmor flags `workflow_run` as a dangerous trigger, and it is right about the
# general case: the job runs with the BASE repo's write token, triggered by a run
# whose output an attacker may have influenced. Accepted here because the risk it
# names is the exact one the substrate split exists to contain, and the containment
# is in this file: the agent job is read-only and can only upload an artifact; this
# job treats that artifact as UNTRUSTED (schema-validated against
# schemas/plan.schema.json before the first write), and its writes are confined to
# `plan/<slug>/v<N>` — an existing frozen TAG is a hard error, so nothing here can
# overwrite an approved plan. Removing the trigger would mean granting the agent
# `contents: write`, which is strictly worse.
# WHY `failure` IS ACCEPTED (2026-09-09, run 34307255293 on test-turtle-1). gh-aw's agent step
# carries the frontmatter `timeout-minutes` as a STEP cap. The first LZA plan finished — result
# event, 45 turns, plan.json uploaded, the Andon raised by safe_outputs — and the cap fired 1.6 s
# later during harness teardown, so the RUN concluded `failure` while gh-aw's own conclusion job
# said "completed successfully with valid safe outputs". A publisher gated on `success` skipped,
# and the break stood with no plan branch and no header: the exact dead end PR #125 describes.
# The conclusion is not the signal; the artifact is. This job now runs on `success` OR `failure`
# and lets the probe below decide: a `plan.json` artifact means there is something to publish
# (validated untrusted, as always); none means the agent did not finish, and the job says so and
# exits clean rather than red — a failed agent run is already red on its own.
# WHY `workflow_dispatch`. GitHub emits no `workflow_run` event for a re-run, and a publish that
# was skipped cannot be replayed — so the operator can ask for one by run id (the id is in the
# Andon's footer). Untrusted input: digits only, read through env, never interpolated into a script.
on: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
    inputs:
      run_id:
        description: "The plan-propose / plan-revise run whose plan.json to publish (digits only — the id in the Andon issue's footer link)"
        required: true
        type: string
  workflow_run:
    # MUST match the compiled workflow's `name:` exactly (workflow_run keys on the name,
    # not the file/workflow id) — drift is caught by tests/unit/workflow-linkage.test.ts.
    workflows:
      - "plan-propose — agent proposes a plan and raises an Andon break"
      # A REVISION lands on the same live branch through the same publisher; the
      # addresses.json artifact adds `addresses: correction #N` commit trailers
      # so the operator's re-judge ✓ unlocks (FR-004).
      - "plan-revise — agent revises a live plan to carry out the operator's corrections"
    types: [completed]
permissions:
  contents: write # plan/<slug>/v<N> branch + plans/<slug>/plan.json commit — the only writer of unfrozen plan branches
  issues: write # locate the Andon break (gh-aw footer run-link) + inject the andon:v1 header the safe-output sanitizer strips
  actions: read # the artifact probe and the cross-run download read ANOTHER run's artifacts; an explicit permissions block sets every unlisted scope to none, and a private target 403s without this (Codex on PR #209)
concurrency:
  group: plan-publish-${{ github.event.workflow_run.id || inputs.run_id }}
jobs:
  publish:
    # `success` or `failure` — see the header. `cancelled` and `skipped` are not accepted: a
    # cancelled agent uploaded nothing worth publishing, and the probe would only say so.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # One resolution of "which run", used by every step below. The dispatch input is
      # untrusted text; it is validated to digits before anything reads it.
      PP_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: probe — did that run upload the artifacts a publish needs?
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$PP_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be digits, got '$PP_RUN_ID'"; exit 1
          fi
          # Only artifacts GitHub can still serve count: an EXPIRED plan.json is listed but not
          # downloadable, and a probe that said "present" would start a publish that dies at the
          # download step (Codex on PR #209).
          live="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PP_RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')"
          expired="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PP_RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == true) | .name')"
          run_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PP_RUN_ID" --jq '.name')"
          has() { grep -qx -- "$1" <<<"$2"; }
          # The reason travels to the reporting step below: a ::notice in this log was the
          # ONLY record of the absence, and it is the one place the operator has no reason
          # to look — the planning run is green and the break is open (GHI #286).
          # `artifacts` is newline-joined here and split on commas OR newlines by the
          # reporter; it is repository data (GitHub's own artifact names), quoted into an
          # env var and never interpolated into a script.
          # RANDOM DELIMITER, not a fixed one (Codex on PR #287): artifact names are chosen
          # by the AGENT, and an artifact named exactly like the delimiter would close the
          # heredoc early and make the rest of the listing parse as invalid $GITHUB_OUTPUT
          # records — failing the probe, so a misnamed upload could still leave the break
          # silent. This is GitHub's own documented practice for untrusted multiline output.
          delim="PP_EOF_$(openssl rand -hex 16)"
          {
            echo "artifacts<<$delim"
            echo "${live:-}"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          if ! has plan.json "$live"; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            if has plan.json "$expired"; then
              echo "reason=expired" >> "$GITHUB_OUTPUT"
              echo "::notice::run $PP_RUN_ID's plan.json artifact has EXPIRED (GitHub's artifact retention) — nothing can be published from it; re-dispatch plan-propose for the workload and, if a headerless Andon still stands for it, withdraw that break first"
            else
              echo "reason=no-artifact" >> "$GITHUB_OUTPUT"
              echo "::notice::run $PP_RUN_ID uploaded no plan.json artifact (live artifacts: ${live:-none}) — the agent did not finish, so there is nothing to publish; that run's own failure is the record"
            fi
            exit 0
          fi
          # A REVISION uploads two artifacts (plan.json, then addresses.json — the correction
          # numbers it carries out). A run that ended between the two would publish a revision
          # whose corrections can never be marked addressed (readAddressesFile reads a missing
          # file as "none"); require the pair before publishing a plan-revise run (Codex on PR #209).
          if [[ "$run_name" == *plan-revise* ]] && ! has addresses.json "$live"; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "reason=revision-incomplete" >> "$GITHUB_OUTPUT"
            echo "::notice::run $PP_RUN_ID is a plan-revise run that uploaded plan.json but no addresses.json — the revision is incomplete (the agent stopped between its two uploads); not published. Re-run plan-revise for the review"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "run $PP_RUN_ID ($run_name) uploaded what a publish needs — publishing"
      # BOTH paths need the toolchain now: publishing runs the writer, and NOT publishing
      # runs the reporter that tells the break so (GHI #286). The probe is the only step
      # that can end this job early, and it does that by failing on a malformed run id.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked).
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci
      # ALSO on the incomplete-revision path, which is the one case where NOT publishing
      # still needs the document: a plan-revise run raises no issue and edits none, so the
      # break it revises carries the original proposal's run link and can only be found by
      # the plan ref inside plan.json (Codex on PR #287). The other two reasons have
      # nothing to download — an absent artifact cannot be fetched, and an expired one
      # cannot be served — so they stay off this step.
      - name: download the proposed plan artifact
        if: steps.probe.outputs.present == 'true' || steps.probe.outputs.reason == 'revision-incomplete'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ env.PP_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/plan-artifacts
      # SAY IT WHERE THE OPERATOR IS LOOKING. The probe above already knows the plan is
      # not coming; before this step that fact lived only in this log, while the break
      # stayed open and the review page explained the silence with a cause that was false
      # on the break that prompted this (test-turtle-1 #134, run 35455533939). Idempotent
      # by marker, so a workflow_run re-delivery or a re-dispatch adds nothing. It does not
      # withdraw the break: ending a review is the operator's act, with their own cause.
      # `--dir` is how it finds a REVISION's break; it publishes nothing, and the publish
      # step below stays gated on an artifact being there.
      - name: tell the break that nothing is coming
        if: steps.probe.outputs.present != 'true' && steps.probe.outputs.reason != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PP_REASON: ${{ steps.probe.outputs.reason }}
          PP_ARTIFACTS: ${{ steps.probe.outputs.artifacts }}
        run: >-
          npx tsx scripts/plan-publish.ts
          --report-absence "$PP_REASON"
          --repo "$GITHUB_REPOSITORY"
          --run-id "$PP_RUN_ID"
          --artifacts "$PP_ARTIFACTS"
          --dir "$RUNNER_TEMP/plan-artifacts"
      - name: publish plan branch (validate, patch andon_issue, branch + commit)
        if: steps.probe.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx tsx scripts/plan-publish.ts
          --dir "$RUNNER_TEMP/plan-artifacts"
          --repo "$GITHUB_REPOSITORY"
          --run-id "$PP_RUN_ID"
