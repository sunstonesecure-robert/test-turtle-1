# plan-publish — deterministic writer for agent-proposed plans (plain Actions
# YAML, no LLM — by design: the plan-propose agentic job is read-only and its
# safe outputs cannot push branches). On plan-propose completion: downloads the
# uploaded plan.json artifact, validates it against schemas/plan.schema.json,
# locates the run's Andon break (andon:v1 header, else the gh-aw footer link to
# this triggering run — the safe-output sanitizer strips agent HTML comments, so
# the publisher injects the canonical header), patches the real andon_issue
# number in, and creates plan/<slug>/v<N> with the document committed at
# plans/<slug>/plan.json — one directory per workload, so one workload's approval
# merge never touches a file another workload's plan branch owns (GHI #79).
# RESUMABLE on re-delivery or partial publish (existing branch/file completed,
# unchanged content = no-op); an existing frozen TAG for the version is a hard
# error (agent must bump). Substrate split: agent proposes, deterministic
# single writer publishes/normalizes.
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: plan-publish
# zizmor flags `workflow_run` as a dangerous trigger, and it is right about the
# general case: the job runs with the BASE repo's write token, triggered by a run
# whose output an attacker may have influenced. Accepted here because the risk it
# names is the exact one the substrate split exists to contain, and the containment
# is in this file: the agent job is read-only and can only upload an artifact; this
# job treats that artifact as UNTRUSTED (schema-validated against
# schemas/plan.schema.json before the first write), and its writes are confined to
# `plan/<slug>/v<N>` — an existing frozen TAG is a hard error, so nothing here can
# overwrite an approved plan. Removing the trigger would mean granting the agent
# `contents: write`, which is strictly worse.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    # MUST match the compiled workflow's `name:` exactly (workflow_run keys on the name,
    # not the file/workflow id) — drift is caught by tests/unit/workflow-linkage.test.ts.
    workflows:
      - "plan-propose — agent proposes a plan and raises an Andon break"
      # A REVISION lands on the same live branch through the same publisher; the
      # addresses.json artifact adds `addresses: correction #N` commit trailers
      # so the operator's re-judge ✓ unlocks (FR-004).
      - "plan-revise — agent revises a live plan to carry out the operator's corrections"
    types: [completed]
permissions:
  contents: write # plan/<slug>/v<N> branch + plans/<slug>/plan.json commit — the only writer of unfrozen plan branches
  issues: write # locate the Andon break (gh-aw footer run-link) + inject the andon:v1 header the safe-output sanitizer strips
concurrency:
  group: plan-publish-${{ github.event.workflow_run.id }}
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked).
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: download the proposed plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/plan-artifacts
      - name: publish plan branch (validate, patch andon_issue, branch + commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PP_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          npx tsx scripts/plan-publish.ts
          --dir "$RUNNER_TEMP/plan-artifacts"
          --repo "$GITHUB_REPOSITORY"
          --run-id "$PP_RUN_ID"
