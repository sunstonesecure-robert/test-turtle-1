# evidence-collect — scheduled dated evidence batches (deterministic, no LLM —
# plain Actions YAML by design, substrate split). Opens the dated
# `evidence:batch` issue and commits `evidence/<date>.json` (FR-021). The
# operator reviews batches on the dashboard's Evidence page and marks
# contradictions there — judgment stays human (constitution:
# Deterministic-First); this workflow only records.
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: evidence-collect
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — operator-configurable interval
  workflow_dispatch:
    inputs:
      source:
        description: "Where this batch's observations come from (e.g. support-inbox, analytics)"
        required: true
      kind:
        description: "feedback | analytics | test-results"
        required: true
        default: feedback
permissions:
  contents: write # evidence/<date>.json — dated, append-only records
  issues: write # the evidence:batch issue
concurrency:
  group: evidence-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked).
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - name: record dated evidence batch (FR-021)
        # Dispatch inputs arrive as env vars, not as `${{ }}` inside `run:` (GHI #130).
        # These two are typed by the operator and were interpolated inside double
        # quotes, which a value containing `"` closes — the same defect as
        # reconcile.yml with a smaller reach (a dispatch already needs write access,
        # and the values label a batch rather than name a ref). Read as "$EC_*" they
        # are data, and the schedule's defaults still apply because the `||` runs in
        # the expression, before the value ever becomes an environment variable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EC_SOURCE: ${{ inputs.source || 'scheduled' }}
          EC_KIND: ${{ inputs.kind || 'feedback' }}
        run: >-
          npx tsx scripts/evidence-collect.ts
          --source "$EC_SOURCE"
          --kind "$EC_KIND"
          --repo "$GITHUB_REPOSITORY"
