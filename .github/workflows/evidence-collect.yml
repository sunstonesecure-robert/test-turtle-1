# evidence-collect — scheduled evidence batches (deterministic, no LLM — plain
# Actions YAML by design, substrate split). Opens the `evidence:batch` issue and
# commits `evidence/<date>-<source>.json` to the `evidence` branch (FR-021). The
# operator reviews batches on the dashboard's Evidence page and marks
# contradictions there — judgment stays human (constitution:
# Deterministic-First); this workflow only records.
#
# The record goes to the `evidence` branch, NOT the default branch (GHI #134).
# Every write this job attempted to the default branch was refused 409 — init
# installs a required `plan-gate` check there whose only bypass is the repo-admin
# role, and a direct push can never carry that check run. This is the only
# workflow that pushed a file to the DEFAULT branch — the other writers touch
# tags or plan/** branches, which that ruleset does not cover — so it is the only
# one the rule ever refused. The record store carries its own append-only ruleset
# instead (no force-push, no deletion).
# cost ceiling: $0 per run (constitution: Cost & Observability)
name: evidence-collect
on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — operator-configurable interval
  workflow_dispatch:
    inputs:
      source:
        description: "Where this batch's observations come from (e.g. support-inbox, analytics)"
        required: true
      kind:
        description: "feedback | analytics | test-results"
        required: true
        default: feedback
permissions:
  contents: write # the record on the `evidence` branch — append-only, created here if absent
  issues: write # the evidence:batch issue
concurrency:
  group: evidence-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No git credentials in .git/config: every write here goes through
          # octokit + GITHUB_TOKEN, never `git push` (zizmor artipacked).
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: record dated evidence batch (FR-021)
        # Dispatch inputs arrive as env vars, not as `${{ }}` inside `run:` (GHI #130).
        # These two are typed by the operator and were interpolated inside double
        # quotes, which a value containing `"` closes — the same defect as
        # reconcile.yml with a smaller reach (a dispatch already needs write access,
        # and the values label a batch rather than name a ref). Read as "$EC_*" they
        # are data, and the schedule's defaults still apply because the `||` runs in
        # the expression, before the value ever becomes an environment variable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EC_SOURCE: ${{ inputs.source || 'scheduled' }}
          EC_KIND: ${{ inputs.kind || 'feedback' }}
        run: >-
          npx tsx scripts/evidence-collect.ts
          --source "$EC_SOURCE"
          --kind "$EC_KIND"
          --repo "$GITHUB_REPOSITORY"
