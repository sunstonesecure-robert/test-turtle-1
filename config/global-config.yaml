homeRegion: us-gov-west-1
enabledRegions:
  - us-gov-west-1
managementAccountAccessRole: AWSControlTowerExecution
cloudwatchLogRetentionInDays: 365
terminationProtection: true
controlTower:
  enable: true
  landingZone:
    version: "4.0"
    accountAutoEnrollment: true
    logging:
      loggingBucketRetentionDays: 365
      accessLoggingBucketRetentionDays: 365
      organizationTrail: true
    security:
      enableIdentityCenterAccess: false
  controls: []
logging:
  account: LogArchive
  centralizedLoggingRegion: us-gov-west-1
  cloudtrail:
    enable: false
    organizationTrail: false
    organizationTrailSettings:
      multiRegionTrail: false
      globalServiceEvents: false
      managementEvents: false
      s3DataEvents: false
      lambdaDataEvents: false
      sendToCloudWatchLogs: false
      apiErrorRateInsight: false
      apiCallRateInsight: false
    accountTrails: []
    lifecycleRules: []
  sessionManager:
    sendToCloudWatchLogs: false
    sendToS3: false
